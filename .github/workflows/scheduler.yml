name: Scheduled jobs

# Vercel's Hobby plan rejects a cron that fires more than once a day, so the frequent catch-up runs
# from here instead: notifications due, overdue assignment and lesson reminders, licence warnings, and
# any election whose window has closed. vercel.json keeps a daily tick as the backstop if this stops.
# GitHub's own scheduler is not guaranteed to the second, which is fine — the endpoint is a catch-up,
# not a timer. Scheduled workflows are paused by GitHub on private repos after 60 days without a push.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run /api/v1/jobs/tick
        shell: bash
        env:
          API_URL: https://emadaaris-deps.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set in Settings → Secrets and variables → Actions." >&2
            exit 1
          fi
          curl --silent --show-error --fail-with-body --max-time 180 \
            --request POST "$API_URL/api/v1/jobs/tick" \
            --header "Authorization: Bearer $CRON_SECRET" | head --bytes 600
